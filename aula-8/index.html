<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/global.css">
  <script src="scripts/index.js" defer></script>
  <title>Formulário validado</title>
</head>
<body>
  <header>
    <h1>Formulário validado</h1>
  </header>
  <main>
    <h2>Cadastro</h2>
    <form id="cadastro" novalidate>
      <label for="nome">Nome completo*</label>
      <input type="text" id="nome" autocomplete="name">
      <p id="erro-nome" class="oculto"></p>

      <label for="email">Email*</label>
      <input type="email" id="email" autocomplete="email">
      <p id="erro-email" class="oculto"></p>

      <label for="cpf">CPF*</label>
      <input type="text" id="cpf" inputmode="numeric" placeholder="000.000.000-00">
      <p id="erro-cpf" class="oculto"></p>

      <label for="nascimento">Data de nascimento*</label>
      <input type="date" id="nascimento">
      <p id="erro-nascimento" class="oculto"></p>

      <label for="celular">Celular*</label>
      <input type="text" id="celular" inputmode="numeric" placeholder="(00) 00000-0000">
      <p id="erro-celular" class="oculto"></p>

      <label for="cep">CEP*</label>
      <input type="text" id="cep" inputmode="numeric" placeholder="00000-000">
      <p id="erro-cep" class="oculto"></p>

      <label for="cidade">Cidade*</label>
      <input type="text" id="cidade">
      <p id="erro-cidade" class="oculto"></p>

      <label for="estado">Estado*</label>
      <select id="estado">
        <option value="">Selecione...</option>
        <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
        <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
        <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
        <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
        <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
        <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
        <option>SP</option><option>SE</option><option>TO</option>
      </select>
      <p id="erro-estado" class="oculto"></p>

      <label for="senha">Senha* (mín. 8 caracteres, com letra e número)</label>
      <input type="password" id="senha" autocomplete="new-password">
      <p id="erro-senha" class="oculto"></p>

      <label for="confirmar-senha">Confirmar senha*</label>
      <input type="password" id="confirmar-senha" autocomplete="new-password">
      <p id="erro-confirmar-senha" class="oculto"></p>

      <label class="termos">
        <input type="checkbox" id="termos">
        Li e aceito os termos
      </label>
      <p id="erro-termos" class="oculto"></p>

      <button type="submit">Enviar</button>
      <p id="concluido" class="oculto"></p>
    </form>
  </main>
  <footer>
    <p>Projeto para conhecermos o JavaScript</p>
  </footer>
</body>
</html>

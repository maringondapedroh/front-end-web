<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu primeiro form</title>
</head>
<body>
  <h1>Cadastro</h1>

  <form action="https://postman-echo.com/post" method="post">

    <p>Nome *<br>
      <input type="text" name="nome" placeholder="Seu nome" required></p>

    <p>E-mail *<br>
      <input type="email" name="email" placeholder="voce@exemplo.com" required></p>

    <p>Telefone<br>
      <input type="text" name="telefone" placeholder="43999999999" pattern="[0-9]{11}" title="11 números, só dígitos"></p>

    <p>Idade<br>
      <input type="number" name="idade"></p>

    <p>Cidade<br>
      <input type="text" name="cidade"></p>

    <p>Data de nascimento<br>
      <input type="date" name="nascimento"></p>

    <p>Gênero favorito<br>
      <select name="genero">
        <option value="ficcao">Ficção</option>
        <option value="fantasia">Fantasia</option>
        <option value="romance">Romance</option>
      </select></p>

    <p>Formato:<br>
      <input type="radio" name="formato" value="fisico" checked> Físico
      <input type="radio" name="formato" value="ebook"> E-book</p>

    <p><input type="checkbox" name="newsletter" value="sim"> Quero receber novidades</p>

    <p>Comentários<br>
      <textarea name="comentarios"></textarea></p>

    <button type="submit">Enviar</button>
  </form>
</body>
</html>

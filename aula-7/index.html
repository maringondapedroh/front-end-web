<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu primeiro JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Meu primeiro JavaScript</h1>

    <section>
      <h2>Saudação</h2>
      <input type="text" id="nome" placeholder="Digite seu nome">
      <button id="btn-saudar">Saudar</button>
      <p id="saudacao"></p>
    </section>

    <section>
      <h2>Contador</h2>
      <p id="contador">0</p>
      <button id="btn-menos">-</button>
      <button id="btn-zerar">Zerar</button>
      <button id="btn-mais">+</button>
    </section>

    <section>
      <h2>Tema</h2>
      <button id="btn-tema">Alternar modo escuro</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
